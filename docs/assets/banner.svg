<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05130d"/>
      <stop offset="35%" stop-color="#0f261a"/>
      <stop offset="75%" stop-color="#163e2a"/>
      <stop offset="100%" stop-color="#040e09"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#05130d" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for neon glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.97); }
      100% { opacity: 0.65; transform: scale(1.03); }
    }

    .float-orb-1 {
      animation: float1 7s ease-in-out infinite;
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }

    .float-orb-2 {
      animation: float2 9s ease-in-out infinite;
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(14px) translateX(-10px); }
    }

    .fade-dash {
      stroke-dasharray: 8 6;
      animation: dashMove 25s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -400; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>

  <!-- High-Tech Hexagonal & Grid Overlay -->
  <g opacity="0.12" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="65" x2="1200" y2="65" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="195" x2="1200" y2="195" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="325" x2="1200" y2="325" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
    <line x1="960" y1="0" x2="960" y2="380" />
    <line x1="1080" y1="0" x2="1080" y2="380" />
  </g>

  <!-- Ambient Glow Behind Title -->
  <circle cx="600" cy="160" r="300" fill="url(#centerGlow)" class="pulse-glow" />

  <!-- Floating Ambient Particles -->
  <circle cx="180" cy="80" r="4.5" fill="#34d399" opacity="0.7" class="float-orb-1"/>
  <circle cx="1020" cy="100" r="5" fill="#fbbf24" opacity="0.6" class="float-orb-2"/>
  <circle cx="150" cy="290" r="3.5" fill="#38bdf8" opacity="0.6" class="float-orb-2"/>
  <circle cx="1070" cy="270" r="4" fill="#34d399" opacity="0.5" class="float-orb-1"/>

  <!-- Decorative Border Orbit -->
  <rect x="20" y="20" width="1160" height="340" rx="12" stroke="#10b981" stroke-opacity="0.32" stroke-width="1.5" class="fade-dash" fill="none" />

  <!-- Badge Top: Full-Stack Agronomic Platform -->
  <g transform="translate(600, 52)">
    <rect x="-195" y="-15" width="390" height="30" rx="15" fill="#122b1e" stroke="#34d399" stroke-width="1" stroke-opacity="0.55"/>
    <circle cx="-168" cy="0" r="4.5" fill="#10b981" filter="url(#subtleGlow)"/>
    <text x="8" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0" letter-spacing="1.5" text-anchor="middle">
      ENTERPRISE AGRI-TECH PLATFORM · PHASES AI-1 TO AI-8
    </text>
  </g>

  <!-- Main Title: HarvestWindow -->
  <g transform="translate(600, 136)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="58" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-1.2">
      Harvest<tspan fill="url(#goldGrad)">Window</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18.5" font-weight="400" text-anchor="middle" fill="#e2e8f0" letter-spacing="0.3">
      <tspan fill="#a7f3d0">Autonomous Harvest Predictions</tspan> · 
      <tspan fill="#fde68a">Grounded RAG Assistant (FAO/ICAR)</tspan> · 
      <tspan fill="#67e8f9">Personalized Alert Engine</tspan>
    </text>
  </g>

  <!-- Feature Pill Tags Bottom -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Core Lifecycle -->
    <g transform="translate(-440, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="8" fill="#10281b" stroke="#10b981" stroke-opacity="0.45" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#d1fae5" text-anchor="middle">
        🌱 Core Lifecycle
      </text>
    </g>

    <!-- Pill 2: Weather & Phenology -->
    <g transform="translate(-220, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#10281b" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#e0f2fe" text-anchor="middle">
        🌦️ Dual-Horizon Weather
      </text>
    </g>

    <!-- Pill 3: Prediction Engine -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#10281b" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fef3c7" text-anchor="middle">
        📈 GDD & Harvest ML
      </text>
    </g>

    <!-- Pill 4: AI-7 Assistant -->
    <g transform="translate(220, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#10281b" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">
        🤖 AI-7 Grounded RAG
      </text>
    </g>

    <!-- Pill 5: AI-8 Alert Engine -->
    <g transform="translate(440, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#10281b" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fecdd3" text-anchor="middle">
        🔔 AI-8 Alert Engine
      </text>
    </g>
  </g>

  <!-- Bottom micro-caption -->
  <g transform="translate(600, 328)">
    <text x="0" y="0" font-family="monospace" font-size="11" font-weight="500" fill="#6ee7b7" opacity="0.9" text-anchor="middle" letter-spacing="1">
      100% TEST COVERAGE · ZERO-COST LOCAL INFERENCE · MULTI-TENANT ISOLATED · REAL AGRONOMIC GROUNDING
    </text>
  </g>
</svg>
