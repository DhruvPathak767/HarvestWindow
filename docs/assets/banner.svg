<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04140b"/>
      <stop offset="35%" stop-color="#092215"/>
      <stop offset="75%" stop-color="#123a24"/>
      <stop offset="100%" stop-color="#030d07"/>
    </linearGradient>

    <!-- Harvest Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Radial Glow Behind Logo -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#04140b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- High-Tech Agronomic Grid Pattern -->
  <g opacity="0.10" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="56" x2="1200" y2="56" />
    <line x1="0" y1="112" x2="1200" y2="112" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="284" x2="1200" y2="284" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="720" y1="0" x2="720" y2="340" />
    <line x1="840" y1="0" x2="840" y2="340" />
    <line x1="960" y1="0" x2="960" y2="340" />
    <line x1="1080" y1="0" x2="1080" y2="340" />
  </g>

  <!-- Soft Ambient Glow Behind Heading -->
  <circle cx="600" cy="150" r="260" fill="url(#centerGlow)"/>

  <!-- Subtle Micro Constellation Dots -->
  <circle cx="160" cy="70" r="3.5" fill="#34d399" opacity="0.6"/>
  <circle cx="1040" cy="90" r="4.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="140" cy="270" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="1060" cy="250" r="3.5" fill="#34d399" opacity="0.4"/>

  <!-- Decorative Border Orbit -->
  <rect x="18" y="18" width="1164" height="304" rx="14" stroke="#10b981" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="8 6" fill="none" />

  <!-- Top Pill Badge: Enterprise Platform Overview -->
  <g transform="translate(600, 48)">
    <rect x="-210" y="-14" width="420" height="28" rx="14" fill="#0d281a" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-185" cy="0" r="4" fill="#10b981"/>
    <text x="8" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5" text-anchor="middle">
      PRECISION AGRICULTURE · ENTERPRISE AI DECISION SYSTEM
    </text>
  </g>

  <!-- Main Brand Title: HarvestWindow -->
  <g transform="translate(600, 126)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="54" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-1">
      Harvest<tspan fill="url(#goldGrad)">Window</tspan>
    </text>
  </g>

  <!-- High-Impact Value Tagline -->
  <g transform="translate(600, 172)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#e2e8f0" letter-spacing="0.3">
      <tspan fill="#a7f3d0">Autonomous Harvest Timing</tspan> · 
      <tspan fill="#fde68a">Grounded Agronomic Assistant (FAO &amp; ICAR)</tspan> · 
      <tspan fill="#67e8f9">Autonomous Alert Engine</tspan>
    </text>
  </g>

  <!-- Feature Pill Tags Bottom -->
  <g transform="translate(600, 238)">
    <!-- Pill 1: Farm & Field Portfolio -->
    <g transform="translate(-430, 0)">
      <rect x="-80" y="-17" width="160" height="34" rx="8" fill="#0c2317" stroke="#10b981" stroke-opacity="0.45" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#d1fae5" text-anchor="middle">
        🌾 Field Portfolio
      </text>
    </g>

    <!-- Pill 2: 10-Day Dual Weather -->
    <g transform="translate(-215, 0)">
      <rect x="-85" y="-17" width="170" height="34" rx="8" fill="#0c2317" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#e0f2fe" text-anchor="middle">
        🌦️ 10-Day Weather
      </text>
    </g>

    <!-- Pill 3: GDD & Harvest Predictions -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-17" width="190" height="34" rx="8" fill="#0c2317" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#fef3c7" text-anchor="middle">
        📈 GDD &amp; Harvest ML
      </text>
    </g>

    <!-- Pill 4: Grounded AI Assistant -->
    <g transform="translate(215, 0)">
      <rect x="-85" y="-17" width="170" height="34" rx="8" fill="#0c2317" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">
        🤖 Agronomic Assistant
      </text>
    </g>

    <!-- Pill 5: Autonomous Alerts -->
    <g transform="translate(430, 0)">
      <rect x="-80" y="-17" width="160" height="34" rx="8" fill="#0c2317" stroke="#f43f5e" stroke-opacity="0.45" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#fecdd3" text-anchor="middle">
        🔔 Alert Engine
      </text>
    </g>
  </g>

  <!-- Bottom Verification Footer Bar -->
  <g transform="translate(600, 296)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#6ee7b7" opacity="0.9" text-anchor="middle" letter-spacing="0.7">
      FULL-STACK TEST VERIFIED · ZERO-COST LOCAL INFERENCE · MULTI-TENANT ISOLATED · FAO &amp; ICAR GROUNDED
    </text>
  </g>
</svg>
