<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a12"/>
      <stop offset="40%" stop-color="#122b1e"/>
      <stop offset="80%" stop-color="#163827"/>
      <stop offset="100%" stop-color="#07140e"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a1a12" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.55; transform: scale(1.02); }
    }

    .shimmer-text {
      background: linear-gradient(90deg, #ecfdf5 0%, #fef3c7 50%, #ecfdf5 100%);
      background-size: 200% auto;
      animation: shimmer 6s linear infinite;
    }
    @keyframes shimmer {
      0% { stop-color: #6ee7b7; }
      50% { stop-color: #fde68a; }
      100% { stop-color: #6ee7b7; }
    }

    .float-orb-1 {
      animation: float1 7s ease-in-out infinite;
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }

    .float-orb-2 {
      animation: float2 9s ease-in-out infinite;
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(14px) translateX(-10px); }
    }

    .fade-dash {
      stroke-dasharray: 8 6;
      animation: dashMove 30s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -400; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid overlay -->
  <g opacity="0.12" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glow Behind Title -->
  <circle cx="600" cy="150" r="280" fill="url(#centerGlow)" class="pulse-glow" />

  <!-- Floating Ambient Particles -->
  <circle cx="220" cy="90" r="4" fill="#34d399" opacity="0.6" class="float-orb-1"/>
  <circle cx="980" cy="110" r="5" fill="#fbbf24" opacity="0.5" class="float-orb-2"/>
  <circle cx="180" cy="270" r="3" fill="#6ee7b7" opacity="0.5" class="float-orb-2"/>
  <circle cx="1040" cy="250" r="4" fill="#34d399" opacity="0.4" class="float-orb-1"/>

  <!-- Decorative Border Orbit -->
  <rect x="24" y="24" width="1152" height="312" rx="12" stroke="#10b981" stroke-opacity="0.28" stroke-width="1.5" class="fade-dash" fill="none" />

  <!-- Badge Top: Full-Stack Agronomic Platform -->
  <g transform="translate(600, 56)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#163827" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="-116" cy="0" r="4" fill="#10b981" filter="url(#subtleGlow)"/>
    <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0" letter-spacing="1.5" text-anchor="middle">
      PHASES 1 TO 6 PRODUCTION READY
    </text>
  </g>

  <!-- Main Title: HarvestWindow -->
  <g transform="translate(600, 140)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="56" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-1">
      Harvest<tspan fill="url(#goldGrad)">Window</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 190)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#93c5fd" opacity="0.95" letter-spacing="0.4">
      <tspan fill="#a7f3d0">Precision Harvest Predictions</tspan> · 
      <tspan fill="#fde68a">10-Day Weather Intelligence</tspan> · 
      <tspan fill="#6ee7b7">Agricultural Recommendations Engine</tspan>
    </text>
  </g>

  <!-- Feature Pill Tags Bottom -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Auth & Farm Mgmt -->
    <g transform="translate(-360, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="8" fill="#122b1e" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#d1fae5" text-anchor="middle">
        🌱 Phase 1-3 Core
      </text>
    </g>

    <!-- Pill 2: Live WeatherAPI -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#122b1e" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0f2fe" text-anchor="middle">
        🌦️ Phase 4 Weather
      </text>
    </g>

    <!-- Pill 3: Prediction Engine -->
    <g transform="translate(120, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="8" fill="#122b1e" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#fef3c7" text-anchor="middle">
        📈 Phase 5 Predictions
      </text>
    </g>

    <!-- Pill 4: Recommendations Engine -->
    <g transform="translate(360, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#122b1e" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">
        ⚡ Phase 6 Guidance
      </text>
    </g>
  </g>

  <!-- Bottom micro-caption -->
  <g transform="translate(600, 316)">
    <text x="0" y="0" font-family="monospace" font-size="11" font-weight="500" fill="#6ee7b7" opacity="0.8" text-anchor="middle" letter-spacing="0.8">
      133/133 AUTOMATED TESTS PASSING · ZERO EXTERNAL AI DEPENDENCY · DETERMINISTIC AGRONOMIC LOGIC
    </text>
  </g>
</svg>
