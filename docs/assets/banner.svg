<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120a"/>
      <stop offset="35%" stop-color="#0c2317"/>
      <stop offset="75%" stop-color="#143926"/>
      <stop offset="100%" stop-color="#030c07"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Ambient Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#04120a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>

  <!-- High-Tech Engineering Grid -->
  <g opacity="0.12" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="56" x2="1200" y2="56" />
    <line x1="0" y1="112" x2="1200" y2="112" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="284" x2="1200" y2="284" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="720" y1="0" x2="720" y2="340" />
    <line x1="840" y1="0" x2="840" y2="340" />
    <line x1="960" y1="0" x2="960" y2="340" />
    <line x1="1080" y1="0" x2="1080" y2="340" />
  </g>

  <!-- Ambient Glow Behind Title -->
  <circle cx="600" cy="150" r="280" fill="url(#centerGlow)"/>

  <!-- Ambient Micro Particles -->
  <circle cx="160" cy="70" r="4" fill="#34d399" opacity="0.7"/>
  <circle cx="1040" cy="90" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="140" cy="270" r="3.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="1060" cy="250" r="4" fill="#34d399" opacity="0.5"/>

  <!-- Decorative Border Orbit -->
  <rect x="20" y="20" width="1160" height="300" rx="12" stroke="#10b981" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="8 6" fill="none" />

  <!-- Top Pill Badge: Enterprise Agri-Tech Platform -->
  <g transform="translate(600, 48)">
    <rect x="-190" y="-14" width="380" height="28" rx="14" fill="#122b1e" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-164" cy="0" r="4" fill="#10b981"/>
    <text x="8" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5" text-anchor="middle">
      ENTERPRISE AGRI-TECH PLATFORM · PHASES AI-1 TO AI-8
    </text>
  </g>

  <!-- Main Title: HarvestWindow -->
  <g transform="translate(600, 126)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="56" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-1">
      Harvest<tspan fill="url(#goldGrad)">Window</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 172)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#e2e8f0" letter-spacing="0.3">
      <tspan fill="#a7f3d0">Autonomous Harvest Predictions</tspan> · 
      <tspan fill="#fde68a">Grounded RAG Assistant (FAO/ICAR)</tspan> · 
      <tspan fill="#67e8f9">Personalized Alert Engine</tspan>
    </text>
  </g>

  <!-- Feature Pill Tags Bottom -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Core Lifecycle -->
    <g transform="translate(-440, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="8" fill="#10281b" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#d1fae5" text-anchor="middle">
        🌱 Core Lifecycle
      </text>
    </g>

    <!-- Pill 2: Dual-Horizon Weather -->
    <g transform="translate(-220, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#10281b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#e0f2fe" text-anchor="middle">
        🌦️ 10-Day Weather
      </text>
    </g>

    <!-- Pill 3: GDD & Harvest ML -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#10281b" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fef3c7" text-anchor="middle">
        📈 GDD &amp; Harvest ML
      </text>
    </g>

    <!-- Pill 4: AI-7 Assistant -->
    <g transform="translate(220, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#10281b" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">
        🤖 AI-7 Grounded RAG
      </text>
    </g>

    <!-- Pill 5: AI-8 Alert Engine -->
    <g transform="translate(440, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#10281b" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fecdd3" text-anchor="middle">
        🔔 AI-8 Alert Engine
      </text>
    </g>
  </g>

  <!-- Bottom micro-caption -->
  <g transform="translate(600, 298)">
    <text x="0" y="0" font-family="monospace" font-size="10.5" font-weight="500" fill="#6ee7b7" opacity="0.95" text-anchor="middle" letter-spacing="0.8">
      100% TEST PASS RATE · ZERO-COST LOCAL INFERENCE · MULTI-TENANT ISOLATED · REAL AGRONOMIC BENCHMARKS
    </text>
  </g>
</svg>
